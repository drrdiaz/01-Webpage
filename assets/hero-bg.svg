<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 680">
<defs>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="screenglow" x="-8%" y="-8%" width="116%" height="116%">
    <feGaussianBlur stdDeviation="1.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#0a1828"/><stop offset="100%" stop-color="#060e1c"/>
  </linearGradient>
  <linearGradient id="dosebar" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ff2200"/><stop offset="25%" stop-color="#ff8800"/>
    <stop offset="50%" stop-color="#ffee00"/><stop offset="75%" stop-color="#44ee88"/>
    <stop offset="100%" stop-color="#1199ff"/>
  </linearGradient>
  <radialGradient id="vignette" cx="50%" cy="50%" r="55%">
    <stop offset="38%" stop-color="#0a1428" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0a1428" stop-opacity="0.88"/>
  </radialGradient>
  <clipPath id="sc"><rect x="544" y="104" width="168" height="452" rx="4"/></clipPath>
</defs>

