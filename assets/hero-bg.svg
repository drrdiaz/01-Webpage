  <circle cx="551" cy="111" r="3" fill="#1e3858"/>
  <circle cx="559" cy="111" r="3" fill="#1e3858"/>
  <rect x="570" y="107" width="30" height="8" rx="2" fill="#142238"/>
  <rect x="605" y="107" width="22" height="8" rx="2" fill="#142238"/>
</g>

<!-- Dose colour bar -->
<rect x="718" y="104" width="8" height="200" rx="2" fill="url(#dosebar)" opacity="0.8"/>
<text x="717" y="102" font-family="monospace" font-size="7" fill="#6aaccc" fill-opacity="0.75">100</text>
<text x="717" y="313" font-family="monospace" font-size="7" fill="#6aaccc" fill-opacity="0.75">0%</text>

<!-- Monitor LED -->
<circle cx="628" cy="554" r="3" fill="#22ee88" fill-opacity="0.75"/>

