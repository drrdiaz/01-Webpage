</g>
<!-- Treatment head -->
<g opacity="0.9">
  <rect x="218" y="316" width="80" height="72" rx="6" fill="#1a2e48" stroke="#3a5880" stroke-width="1.6"/>
  <rect x="224" y="322" width="68" height="13" rx="3" fill="#243860" fill-opacity="0.45"/>
  <rect x="228" y="343" width="60" height="5" rx="1.5" fill="#2e4870" stroke="#4a6898" stroke-width="0.7"/>
