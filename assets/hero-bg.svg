<rect x="538" y="100" width="180" height="452" rx="7" fill="url(#screenBg)" stroke="#1a2e48" stroke-width="1"/>

<g clip-path="url(#sc)">
  <!-- ── TOP PANEL: Axial Pelvis CT ── -->
  <rect x="544" y="104" width="168" height="215" fill="#060e1c"/>
  <text x="550" y="118" font-family="monospace" font-size="7.5" fill="#4a8aaa" fill-opacity="0.85">PELVIS  AX  CT  5mm</text>

  <!-- Body boundary -->
  <ellipse cx="628" cy="198" rx="72" ry="55" fill="none" stroke="#2e5572" stroke-width="1.2"/>
  <!-- Left iliac wing -->
  <path d="M 558,192 Q 550,178 558,165 Q 570,156 580,165 Q 586,178 581,192 Z"
        fill="none" stroke="#3a6888" stroke-width="1.1"/>
  <!-- Right iliac wing -->
  <path d="M 698,192 Q 706,178 698,165 Q 686,156 676,165 Q 670,178 675,192 Z"
        fill="none" stroke="#3a6888" stroke-width="1.1"/>
  <!-- Sacrum posterior -->
  <path d="M 610,218 Q 618,230 628,232 Q 638,230 646,218 Q 640,208 628,206 Q 616,208 610,218 Z"
        fill="#0a1828" stroke="#3a6080" stroke-width="1.1"/>
  <!-- Spinal canal -->
  <ellipse cx="628" cy="216" rx="6" ry="5" fill="#060e1c" stroke="#2a5070" stroke-width="0.9"/>
  <!-- Left femoral head -->
  <circle cx="576" cy="205" r="11" fill="none" stroke="#3a6888" stroke-width="1.2"/>
  <circle cx="576" cy="205" r="5" fill="none" stroke="#2a5070" stroke-width="0.8"/>
  <!-- Right femoral head -->
  <circle cx="680" cy="205" r="11" fill="none" stroke="#3a6888" stroke-width="1.2"/>
  <circle cx="680" cy="205" r="5" fill="none" stroke="#2a5070" stroke-width="0.8"/>
  <!-- Bladder (anterior oval) -->
  <ellipse cx="628" cy="172" rx="15" ry="11" fill="#0c1c38" stroke="#2e5580" stroke-width="1" stroke-opacity="0.8"/>
  <!-- Rectum (posterior) -->
  <ellipse cx="628" cy="212" rx="9" ry="7" fill="#0a1428" stroke="#2a4460" stroke-width="0.9" stroke-dasharray="2,2"/>
  <!-- Prostate / target -->
  <ellipse cx="628" cy="192" rx="10" ry="8" fill="#0a1428" stroke="#3a5878" stroke-width="1"/>
  <!-- Isodose on target -->
  <g filter="url(#screenglow)">
    <ellipse cx="628" cy="192" rx="6" ry="5" fill="#ff2200" fill-opacity="0.8"/>
    <ellipse cx="628" cy="192" rx="11" ry="9" fill="none" stroke="#ff7700" stroke-width="1.5" stroke-opacity="0.9"/>
    <ellipse cx="628" cy="192" rx="18" ry="14" fill="none" stroke="#ffcc00" stroke-width="1.2" stroke-opacity="0.75"/>
    <ellipse cx="628" cy="192" rx="28" ry="22" fill="none" stroke="#44ee88" stroke-width="1" stroke-opacity="0.55"/>
    <ellipse cx="628" cy="192" rx="40" ry="32" fill="none" stroke="#22aaff" stroke-width="0.8" stroke-opacity="0.38"/>
  </g>

  <!-- Panel divider -->
  <line x1="544" y1="319" x2="712" y2="319" stroke="#1e3252" stroke-width="1.5"/>

  <!-- ── BOTTOM PANEL: Sagittal Spine ── -->
  <rect x="544" y="319" width="168" height="237" fill="#050c1a"/>
  <text x="550" y="333" font-family="monospace" font-size="7.5" fill="#4a8aaa" fill-opacity="0.85">SPINE  SAG  CT  3mm</text>

  <!-- Soft tissue (anterior) -->
  <path d="M 596,346 Q 588,390 588,430 Q 590,465 594,498" fill="none" stroke="#1e3a58" stroke-width="1.2" stroke-opacity="0.6"/>
  <!-- Posterior soft tissue -->
  <path d="M 668,346 Q 678,388 678,430 Q 676,464 672,498" fill="none" stroke="#1e3a58" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Vertebral bodies L1–L5 + sacrum -->
  <g stroke="#2a5070" stroke-width="1" fill="#0c1c30">
    <rect x="596" y="344" width="44" height="20" rx="3"/>
    <rect x="596" y="368" width="44" height="20" rx="3"/>
    <rect x="596" y="392" width="44" height="20" rx="3"/>
    <rect x="596" y="416" width="44" height="20" rx="3"/>
    <rect x="596" y="440" width="44" height="20" rx="3"/>
    <rect x="596" y="466" width="46" height="22" rx="3" fill="#0a1828"/>
  </g>
  <!-- Intervertebral discs -->
  <g fill="#162840" stroke="none">
    <rect x="599" y="364" width="38" height="4" rx="1.5"/>
    <rect x="599" y="388" width="38" height="4" rx="1.5"/>
    <rect x="599" y="412" width="38" height="4" rx="1.5"/>
    <rect x="599" y="436" width="38" height="4" rx="1.5"/>
    <rect x="599" y="462" width="38" height="4" rx="1.5"/>
  </g>
  <!-- Spinous processes -->
  <g fill="#0a1428" stroke="#243e58" stroke-width="0.8">
    <rect x="640" y="348" width="18" height="14" rx="2"/>
    <rect x="640" y="372" width="18" height="14" rx="2"/>
    <rect x="640" y="396" width="18" height="14" rx="2"/>
    <rect x="640" y="420" width="18" height="14" rx="2"/>
    <rect x="640" y="444" width="14" height="12" rx="2"/>
  </g>
  <!-- Spinal canal -->
  <rect x="590" y="344" width="6" height="148" rx="3" fill="#070f1e" stroke="#1e3a54" stroke-width="0.8"/>

  <!-- Dose wash — L3 level target -->
  <g filter="url(#screenglow)">
    <rect x="600" y="396" width="36" height="14" rx="2" fill="#ff4400" fill-opacity="0.5"/>
    <rect x="596" y="393" width="44" height="20" rx="3" fill="none" stroke="#ff9900" stroke-width="1.3" stroke-opacity="0.85"/>
    <rect x="590" y="388" width="56" height="30" rx="4" fill="none" stroke="#ffdd00" stroke-width="1" stroke-opacity="0.6"/>
    <rect x="583" y="382" width="70" height="42" rx="5" fill="none" stroke="#44ee88" stroke-width="0.8" stroke-opacity="0.4"/>
  </g>

  <!-- Toolbar top of each panel -->
