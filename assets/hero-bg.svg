  <circle cx="288" cy="325" r="7" fill="none" stroke="#22ddaa" stroke-width="0.9" stroke-opacity="0.3"/>
</g>

<!-- ═══════════════════════════════════════
     PLANNING MONITOR — RIGHT (x: 535–755)
     ═══════════════════════════════════════ -->
<!-- Stand -->
<g opacity="0.55">
  <ellipse cx="628" cy="598" rx="48" ry="7" fill="#0e1c30"/>
  <rect x="620" y="556" width="16" height="46" rx="3" fill="#14223a" stroke="#1e3050" stroke-width="1"/>
</g>
<!-- Bezel -->
